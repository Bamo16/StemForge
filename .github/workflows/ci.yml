name: CI

on:
  push:
    branches: [main, "integration/**"]
  pull_request:
    branches: [main, "integration/**"]
  # Weekly, so a YouTube change that breaks downloads fails here before it reaches users.
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  linux-smoke:
    name: Linux smoke test (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Read the SDK version from global.json rather than repeating it here. The two drifted once
      # (a runner on preview.4, local development on preview.6) and the difference in their
      # implicit-using sets shipped a release whose source did not compile on Linux. One source of
      # truth means a local build and this job use the same compiler.
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore StemForge.slnx

      - name: Build
        run: dotnet build StemForge.slnx --configuration Release --no-restore

      # Offline suite: full test run including the catalog well-formedness checks. The live asset
      # tests are skipped here because STEMFORGE_LIVE_ASSETS is not set. No uv / audio-separator
      # install happens in this job.
      - name: Test (offline suite)
        run: dotnet test StemForge.slnx --configuration Release --no-build

      # Network step: download + SHA-256 verify the three linux-x64 bundled binaries (yt-dlp,
      # ffmpeg, deno) and exercise the ffmpeg tar.gz extraction path (running it once). Gated by the env var so the
      # offline suite above stays fast and hermetic.
      - name: Verify bundled assets (live download + SHA-256)
        env:
          STEMFORGE_LIVE_ASSETS: "1"
        run: >-
          dotnet test StemForge.slnx --configuration Release --no-build
          -- --filter-class StemForge.Tests.Tooling.LiveBundledAssetTests

      # Networked download integration test: fetches a small license-safe audio clip over the
      # network and verifies the file plus its metadata. Gated by STEMFORGE_INTEGRATION so the
      # offline suite stays hermetic. Allowed to fail (remote host availability) without blocking.
      - name: Download integration test (networked)
        continue-on-error: true
        env:
          STEMFORGE_INTEGRATION: "1"
        run: >-
          dotnet test StemForge.slnx --configuration Release --no-build
          -- --filter-class StemForge.Tests.Integration.NetworkedDownloadIntegrationTests

      # A fresh install: setup's bundled fetch into an empty bin folder, then detection finds
      # every tool. Catches a pin whose URL, hash or archive layout no longer works.
      - name: Fresh install (live)
        env:
          STEMFORGE_LIVE_ASSETS: "1"
        run: >-
          dotnet test StemForge.slnx --configuration Release --no-build
          -- --filter-class StemForge.Tests.Integration.FreshInstallTests

  windows:
    name: Windows tests and fresh install (win-x64)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore StemForge.slnx

      - name: Build
        run: dotnet build StemForge.slnx --configuration Release --no-restore

      - name: Test (offline suite)
        run: dotnet test StemForge.slnx --configuration Release --no-build

      # The platform StemForge ships: install ffmpeg, yt-dlp and deno exactly as setup does, and
      # check each one runs.
      - name: Fresh install (live)
        env:
          STEMFORGE_LIVE_ASSETS: "1"
        run: >-
          dotnet test StemForge.slnx --configuration Release --no-build
          -- --filter-class StemForge.Tests.Integration.FreshInstallTests

      # Resolves and downloads a real YouTube video on that fresh install, the way the app does.
      # Allowed to fail: YouTube sometimes asks CI machines to sign in. A failure here is still
      # worth reading, because it is how a stale yt-dlp or a changed YouTube shows up.
      - name: YouTube download on a fresh install (live)
        continue-on-error: true
        env:
          STEMFORGE_LIVE_ASSETS: "1"
          STEMFORGE_LIVE_YOUTUBE: "1"
        run: >-
          dotnet test StemForge.slnx --configuration Release --no-build
          -- --filter-class StemForge.Tests.Integration.FreshInstallTests
